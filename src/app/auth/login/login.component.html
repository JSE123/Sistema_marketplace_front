
<div class="login-container">
  <div class="login-card">
    <div class="login-brand">
      <img src="images/logo_marketplace.jpg" alt="Marketplace Logo" class="logo">
      <h1>Marketplace Pro</h1>
      <p>Accede a tu cuenta para comenzar</p>
    </div>

    <form class="login-form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          type="text" 
          id="username" 
          formControlName="username" 
          placeholder="username"
          [ngClass]="{ 'is-invalid': submitted && f['username'].errors }"
          [(ngModel)]="loginRequest.username">
        <div *ngIf="submitted && f['username'].errors" class="invalid-feedback">
          <div *ngIf="f['username'].errors['required']">Username es requerido</div>
          <div *ngIf="f['username'].errors['username']">Nombre de usuario no es válido</div>
          <div *ngIf="f['username'].errors['incorrect']"></div>

        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-input">
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            [ngClass]="{ 'is-invalid': submitted && f['password'].errors }">
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <i class="material-icons">{{ showPassword ? 'visibility_off' : 'visibility' }}</i>
          </button>
        </div>
        <div *ngIf="submitted && f['password'].errors" class="invalid-feedback">
          <div *ngIf="f['password'].errors['required']">Contraseña es requerida</div>
          <div *ngIf="f['password'].errors['minlength']">Mínimo 6 caracteres</div>
          <div *ngIf="f['password'].errors['incorrect']">Usuario o contraseña incorrecta</div>

        </div>
  
      </div>

      <div class="form-options">
        <div class="remember-me">
          <input type="checkbox" id="remember" formControlName="remember">
          <label for="remember">Recuérdame</label>
        </div>
        <a routerLink="/forgot-password" class="forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="login-button" [disabled]="loading">
        <span *ngIf="!loading">Iniciar sesión</span>
        <span *ngIf="loading" class="spinner"></span>
      </button>

      <div class="social-login">
        <p>O inicia sesión con</p>
        <div class="social-buttons">
          <button type="button" class="social-button google">
            <img src="icons/icono_google.svg" alt="Google">
            Google
          </button>
          <button type="button" class="social-button facebook">
            <img src="icons/icono_facebook.svg" alt="Facebook">
            Facebook
          </button>
        </div>
      </div>

      <div class="register-link">
        ¿No tienes una cuenta? <a routerLink="/sign-up">Regístrate</a>
      </div>
    </form>
  </div>

  <div class="login-image">
    <img src="images/imagen.jpg" alt="Marketplace">
    <!-- <img src="assets/marketplace-login.jpg" alt="Marketplace"> -->
  </div>
</div>
