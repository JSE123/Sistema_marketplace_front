<app-haeder></app-haeder>
<div class="productos-container">
  <!-- Encabezado -->
  <div class="header">
    <h2 *ngIf="categoriaNombre">Productos de {{ categoriaNombre }}</h2>
    <h2 *ngIf="searchTerm">Resultados para "{{ searchTerm }}" ({{ totalItems }})</h2>
    <div *ngIf="!categoriaNombre && !searchTerm">
      Todos los productos ({{ totalItems }})
    </div>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="loading">
    <mat-spinner></mat-spinner>
  </div>

  <!-- Lista de productos -->
  <div *ngIf="!loading" class="productos-grid">
    <mat-card *ngFor="let producto of displayedProductos" class="producto-card">
      <img mat-card-image [src]="producto.imageUrls" [alt]="producto.nombre">
      <mat-card-content>
        <h3>{{ producto.title }}</h3>
        <p>{{ producto.price | currency }}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/product', producto.id]" >Ver detalles</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <!-- Paginación -->
  <mat-paginator *ngIf="totalItems > pageSize"
                 [length]="totalItems"
                 [pageSize]="pageSize"
                 [pageIndex]="currentPage - 1"
                 (page)="onPageChange($event.pageIndex + 1)"
                 class="paginador">
  </mat-paginator>

  <!-- Sin resultados -->
  <div *ngIf="!loading && totalItems === 0" class="no-results">
    <mat-icon>search_off</mat-icon>
    <p>No se encontraron productos</p>
  </div>
</div>
